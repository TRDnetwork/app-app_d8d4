<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#F8FAFC"/>
  <text x="50" y="50" font-family="Inter, sans-serif" font-weight="800" font-size="40" fill="#0F172A">Inter Black</text>
  <text x="50" y="90" font-family="Inter, sans-serif" font-weight="700" font-size="32" fill="#0F172A">Inter Bold</text>
  <text x="50" y="130" font-family="Inter, sans-serif" font-weight="600" font-size="28" fill="#0F172A">Inter Semi-Bold</text>
  <text x="50" y="170" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#0F172A">Inter Medium</text>
  <text x="50" y="210" font-family="Inter, sans-serif" font-weight="400" font-size="20" fill="#0F172A">Inter Regular</text>
  <text x="50" y="250" font-family="Inter, sans-serif" font-weight="300" font-size="18" fill="#0F172A">Inter Light</text>
  <text x="350" y="50" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="#0F172A">Body Text: 1rem / 16px</text>
  <text x="350" y="80" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#64748B">Secondary Text: 0.875rem / 14px</text>
  <text x="350" y="110" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#64748B">Caption Text: 0.75rem / 12px</text>
  <rect x="350" y="140" width="200" height="100" rx="10" fill="white" stroke="#E2E8F0"/>
  <text x="360" y="160" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#0F172A">Sample Paragraph</text>
  <text x="360" y="180" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#64748B">This is a sample paragraph demonstrating the typography system. The text is set in Inter with appropriate line heights and spacing for optimal readability.</text>
</svg>