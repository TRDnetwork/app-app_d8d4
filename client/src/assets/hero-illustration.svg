<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0F172A"/>
  
  <!-- Background elements -->
  <circle cx="200" cy="100" r="80" fill="#1E293B" opacity="0.6"/>
  <circle cx="600" cy="300" r="120" fill="#1E293B" opacity="0.4"/>
  <rect x="100" y="250" width="150" height="150" rx="20" fill="#1E293B" opacity="0.5"/>
  
  <!-- Product cards -->
  <g transform="translate(150, 80)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="20" width="140" height="100" rx="8" fill="#FF9900" opacity="0.2"/>
    <circle cx="90" cy="70" r="30" fill="#FF9900" opacity="0.3"/>
    <circle cx="90" cy="70" r="15" fill="#FF9900"/>
    <text x="90" y="150" font-family="Source Sans Pro" font-size="14" fill="#94A3B8" text-anchor="middle">Premium Headphones</text>
    <text x="90" y="180" font-family="Source Sans Pro" font-weight="bold" font-size="18" fill="#F8FAFC" text-anchor="middle">$99.99</text>
  </g>
  
  <g transform="translate(370, 120)">
    <!-- Card 2 -->
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="20" width="140" height="100" rx="8" fill="#1E40AF" opacity="0.2"/>
    <rect x="50" y="50" width="80" height="40" rx="6" fill="#1E40AF" opacity="0.5"/>
    <rect x="70" y="65" width="40" height="10" rx="3" fill="#FF9900"/>
    <text x="90" y="150" font-family="Source Sans Pro" font-size="14" fill="#94A3B8" text-anchor="middle">Smart Watch</text>
    <text x="90" y="180" font-family="Source Sans Pro" font-weight="bold" font-size="18" fill="#F8FAFC" text-anchor="middle">$199.99</text>
  </g>
  
  <!-- Delivery truck -->
  <g transform="translate(600, 200)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#FF9900"/>
    <rect x="10" y="10" width="40" height="40" rx="6" fill="#1E293B"/>
    <circle cx="20" cy="50" r="10" fill="#334155"/>
    <circle cx="100" cy="50" r="10" fill="#334155"/>
    <rect x="60" y="15" width="50" height="30" rx="6" fill="#1E293B"/>
    <text x="85" y="35" font-family="Source Sans Pro" font-weight="bold" font-size="12" fill="#F8FAFC" text-anchor="middle">FAST</text>
    <text x="85" y="50" font-family="Source Sans Pro" font-weight="bold" font-size="12" fill="#F8FAFC" text-anchor="middle">SHIP</text>
  </g>
</svg>
