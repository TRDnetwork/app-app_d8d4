<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#0F172A"/>
  
  <!-- Empty cart illustration -->
  <g transform="translate(50, 40)">
    <!-- Cart outline -->
    <path d="M0,40 L80,40 L100,0 L180,0 L180,20 L160,60 L20,60 Z" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Cart handle -->
    <path d="M60,0 C60,-20 120,-20 120,0" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Empty sign -->
    <rect x="40" y="20" width="80" height="20" rx="4" fill="#1E293B"/>
    <text x="80" y="35" font-family="Source Sans Pro" font-size="14" fill="#94A3B8" text-anchor="middle">Empty</text>
  </g>
  
  <!-- Message -->
  <text x="150" y="140" font-family="Source Sans Pro" font-size="18" fill="#94A3B8" text-anchor="middle">Your cart is empty</text>
  <text x="150" y="170" font-family="Source Sans Pro" font-size="14" fill="#64748B" text-anchor="middle">Add some products to get started</text>
</svg>
