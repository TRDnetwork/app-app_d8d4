<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Logo -->
  <text x="60" y="80" font-family="Playfair Display" font-size="48" font-weight="bold" fill="#FF9900">ShopSphere</text>
  
  <!-- Main content -->
  <text x="60" y="160" font-family="Source Sans Pro" font-size="36" font-weight="600" fill="#F8FAFC">Premium E-commerce Platform</text>
  <text x="60" y="210" font-family="Source Sans Pro" font-size="24" fill="#94A3B8">Discover amazing products with fast delivery</text>
  
  <!-- Product showcase -->
  <g transform="translate(60, 280)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="200" height="200" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="100" cy="100" r="60" fill="#FF9900" opacity="0.3"/>
    <circle cx="100" cy="100" r="30" fill="#FF9900"/>
    
    <!-- Product 2 -->
    <rect x="240" y="0" width="200" height="200" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="300" y="60" width="80" height="80" rx="8" fill="#1E40AF"/>
    <rect x="320" y="80" width="40" height="40" rx="4" fill="#FF9900"/>
    
    <!-- Product 3 -->
    <rect x="480" y="0" width="200" height="200" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <path d="M580,60 L620,100 L580,140 L540,100 Z" fill="#FF9900"/>
    <circle cx="580" cy="100" r="40" fill="none" stroke="#1E40AF" stroke-width="4"/>
  </g>
  
  <!-- Tagline -->
  <text x="60" y="540" font-family="Source Sans Pro" font-size="28" fill="#94A3B8">Shop smarter. Deliver faster. Live better.</text>
  
  <!-- Accent bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#FF9900"/>
</svg>
