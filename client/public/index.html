<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="ShopSphere – A premium e-commerce platform with Amazon-like features, dark theme, and warm accents." />
    <meta name="theme-color" content="#FF9900" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <title>ShopSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
    <!-- ANALYTICS: GA4 tracking script - loaded async, respects DNT -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=/* ANALYTICS_KEY */"></script>
    <script>
      // Respect Do Not Track
      if (!navigator.doNotTrack || navigator.doNotTrack !== "1") {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '/* ANALYTICS_KEY */', {
          page_title: document.title,
          page_location: window.location.href,
          page_path: window.location.pathname,
          send_page_view: true
        });
      }
    </script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="bg-bg text-text font-body antialiased">
    <div id="root"></div>
  </body>
</html>
