<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopSphere – A full-featured e-commerce platform with Amazon-like functionality" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
    <title>ShopSphere</title>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- ANALYTICS: PostHog tracking script -->
    <script>
      // Respect Do Not Track
      if (!navigator.doNotTrack && !window.doNotTrack && navigator.doNotTrack !== "1" && window.doNotTrack !== "1") {
        // Load PostHog script asynchronously
        document.addEventListener('DOMContentLoaded', function() {
          var script = document.createElement('script');
          script.type = 'text/javascript';
          script.async = true;
          script.src = 'https://app.posthog.com/static/array.js';
          script.onload = function() {
            window.posthog = window.posthog || [];
            window.posthog.push(['init', /* ANALYTICS_KEY */ 'phc_your_posthog_key_here', {api_host:'https://app.posthog.com'}]);
            
            // Track page views
            window.posthog.push(['capture', '$pageview']);
          };
          document.head.appendChild(script);
        });
      }
    </script>
  </head>
  <body class="bg-bg text-text font-body antialiased">
    <div id="root"></div>
  </body>
</html>
