<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shop the best products with fast delivery and trusted reviews" />
  <meta name="robots" content="index, follow" />
  <meta name="title" content="ShopSphere - Premium E-Commerce Marketplace" />
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="ShopSphere - Premium E-Commerce Marketplace" />
  <meta property="og:description" content="Shop the best products with fast delivery and trusted reviews" />
  <meta property="og:image" content="https://shopsphere.com/og-image.jpg" />
  <meta property="og:url" content="https://shopsphere.com" />
  <meta property="og:type" content="website" />
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ShopSphere - Premium E-Commerce Marketplace" />
  <meta name="twitter:description" content="Shop the best products with fast delivery and trusted reviews" />
  <meta name="twitter:image" content="https://shopsphere.com/og-image.jpg" />
  
  <title>ShopSphere - Premium E-Commerce Marketplace</title>
  
  <!-- Schema.org Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ShopSphere",
    "url": "https://shopsphere.com",
    "logo": "https://shopsphere.com/logo.png",
    "foundingDate": "2024",
    "founders": [
      {
        "@type": "Person",
        "name": "Alex Morgan"
      },
      {
        "@type": "Person",
        "name": "Taylor Reed"
      }
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "email": "support@shopsphere.com",
      "url": "https://shopsphere.com/contact"
    },
    "sameAs": [
      "https://twitter.com/shopsphere",
      "https://facebook.com/shopsphere",
      "https://instagram.com/shopsphere"
    ]
  }
  </script>
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ShopSphere",
    "url": "https://shopsphere.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://shopsphere.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    },
    "breadcrumb": {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://shopsphere.com"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Products",
          "item": "https://shopsphere.com/products"
        }
      ]
    }
  </script>
  
  <!-- ANALYTICS: GA4 for e-commerce -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=/* GA4_MEASUREMENT_ID */"></script>
  <script>
    // Respect Do Not Track
    if (!navigator.doNotTrack) {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '/* GA4_MEASUREMENT_ID */', {
        page_path: window.location.pathname,
      });
      
      // Track page views
      document.addEventListener('DOMContentLoaded', function() {
        gtag('event', 'page_view', {
          page_title: document.title,
          page_location: window.location.href,
          page_path: window.location.pathname
        });
      });
      
      // Track CTA clicks
      document.addEventListener('click', function(e) {
        if (e.target.matches('[data-cta]')) {
          gtag('event', 'click', {
            event_category: 'CTA',
            event_label: e.target.getAttribute('data-cta')
          });
        }
      });
      
      // Track form submissions
      document.addEventListener('submit', function(e) {
        if (e.target.matches('[data-form]')) {
          gtag('event', 'form_submit', {
            event_category: 'Form',
            event_label: e.target.getAttribute('data-form')
          });
        }
      });
    }
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
